[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-testes-mef"
version = "0.1.0"
description = "LLMs geram bons testes a partir de máquinas de estados finitos? Comparação com o método W e cobertura de transições, medida por mutação."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["openai>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
testes_mef = ["benchmarks/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
